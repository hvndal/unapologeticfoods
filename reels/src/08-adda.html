<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>08 · Adda</title>
<!-- Abstract mood piece: smoke, embers, firelight, arches. Scored with reels/score.py. -->
<link rel="stylesheet" href="lib/reel.css">
<style>
  .stage { background: #000; }
  #smoke { position: absolute; inset: 0; width: 540px; height: 960px; filter: blur(14px); opacity: 0; }
  #fire { position: absolute; inset: -60px; width: 660px; height: 1080px; object-fit: cover; filter: blur(22px) saturate(1.3) brightness(.55) hue-rotate(-12deg); opacity: 0; mix-blend-mode: screen; }
  .arches { position: absolute; left: 50%; top: 480px; width: 0; height: 0; }
  .arches svg { position: absolute; left: -100px; top: -150px; width: 200px; height: 300px; overflow: visible; }
  .arches path { fill: none; stroke: #d6b98a; stroke-width: .9; vector-effect: non-scaling-stroke; }
  .t { position: absolute; left: 0; right: 0; text-align: center; }
  #adda { top: 400px; font-family: var(--f-display); font-weight: 200; font-size: 96px; letter-spacing: .04em; color: var(--bone); font-variation-settings: "opsz" 144, "SOFT" 60; }
  #adda span { display: inline-block; }
  #addahi { top: 530px; font-family: var(--f-deva); font-size: 22px; color: rgba(214, 185, 138, .8); letter-spacing: .1em; }
  #rule { position: absolute; left: 50%; top: 480px; width: 300px; margin-left: -150px; height: 1px; background: linear-gradient(90deg, transparent, #d6b98a, transparent); }
  #made { top: 452px; font-family: var(--f-display); font-style: italic; font-weight: 300; font-size: 17px; color: rgba(242, 233, 221, .7); }
  #mander { top: 482px; font-family: var(--f-sans); font-size: 13px; font-weight: 400; letter-spacing: .9em; text-transform: uppercase; color: var(--bone); padding-left: .9em; }
</style></head>
<body>
<div class="stage" id="stage">
  <img id="fire" alt="">
  <canvas id="smoke"></canvas>
  <div class="arches" id="arches"></div>
  <canvas class="embers" id="emb"></canvas>
  <p class="t" id="adda"></p>
  <p class="t" id="addahi" lang="hi">अड्डा</p>
  <div id="rule"></div>
  <p class="t" id="made">made by</p>
  <p class="t" id="mander">Mander</p>
  <div class="grain" style="opacity:.1"></div>
</div>
<script src="lib/reel.js"></script>
<script>
(() => {
  const { $, p, ease, op } = R;
  window.DURATION = 21;
  const io = (t, a, b, f = 1.2) => ease.inOut(p(t, a, f)) * (1 - ease.inOut(p(t, b - f, f)));

  // Adda, letter by letter
  const adda = $('#adda');
  const letters = [...'Adda'].map(c => { const s = document.createElement('span'); s.textContent = c; adda.appendChild(s); return s; });

  // smoke: drifting value-noise field, lit warm from below
  const cv = $('#smoke'); cv.width = 135; cv.height = 240;
  const cx = cv.getContext('2d'), img = cx.createImageData(135, 240);
  const rnd = R.rng(3), G = 64, grid = Float32Array.from({ length: G * G }, rnd);
  const sm = x => x * x * (3 - 2 * x);
  const vn = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = sm(x - xi), yf = sm(y - yi);
    const g = (a, b) => grid[((a % G + G) % G) + ((b % G + G) % G) * G];
    return R.lerp(R.lerp(g(xi, yi), g(xi + 1, yi), xf), R.lerp(g(xi, yi + 1), g(xi + 1, yi + 1), xf), yf);
  };
  const smoke = t => {
    for (let y = 0; y < 240; y++) for (let x = 0; x < 135; x++) {
      const u = x / 13, v = y / 46 + t * 0.3;
      const w = vn(u + t * 0.1, v) * 2;
      let f = vn(u + w, v - t * 0.2) * 0.6 + vn(u * 2.1 + w, v * 2.1) * 0.3 + vn(u * 4.3, v * 4.3 - t) * 0.1;
      f = Math.max(0, f - 0.5) * 1.5 * (0.25 + 0.75 * (y / 240));
      const i = (y * 135 + x) * 4;
      img.data[i] = 255 * Math.min(1, f * 1.05); img.data[i + 1] = 170 * Math.min(1, f * .95); img.data[i + 2] = 110 * f; img.data[i + 3] = 255;
    }
    cx.putImageData(img, 0, 0);
  };

  // a slow corridor of arches
  const host = $('#arches');
  const arches = Array.from({ length: 9 }, () => { const s = R.html(`<svg viewBox="0 0 200 300"><path d="${R.ARCH}"/></svg>`); host.appendChild(s); return s; });

  const emb = R.embers($('#emb'), 60, 11);
  R.every(t => {
    // 0–4 · Adda
    letters.forEach((s, i) => {
      const e = ease.inOut(p(t, 0.8 + i * 0.22, 1.4));
      op(s, e * (1 - ease.inOut(p(t, 4.2, 1))));
      s.style.transform = `translateY(${(14 * (1 - e)).toFixed(2)}px)`;
      s.style.filter = `blur(${(6 * (1 - e)).toFixed(2)}px)`;
    });
    op($('#addahi'), io(t, 1.9, 5.2));
    op($('#rule'), io(t, 2.2, 5.2));
    $('#rule').style.transform = `scaleX(${ease.inOut(p(t, 2.2, 1.6)).toFixed(4)})`;

    // 4–11 · smoke, then firelight bleeding through
    if (t > 3.5 && t < 16) smoke(t);
    op($("#smoke"), 0.75 * io(t, 3.8, 15.5, 2));
    if (t > 6.5 && t < 15.5) R.fire($('#fire'), (t - 6.5) * 0.45);
    op($('#fire'), 0.7 * io(t, 7, 15.2, 2));
    $('#fire').style.transform = `scale(${(1.1 + 0.02 * (t - 7)).toFixed(4)}) rotate(${(0.3 * (t - 7)).toFixed(2)}deg)`;

    // 9–17 · arches drawing, then drifting toward camera
    arches.forEach((a, i) => {
      const pa = $('path', a);
      R.drawMid(pa, ease.inOut(p(t, 8.5 + i * 0.25, 1.8)));
      const z = Math.pow(1.32, i - 2) * (1 + 0.09 * Math.max(0, t - 11));
      a.style.transform = `scale(${z.toFixed(4)})`;
      op(a, io(t, 8.5, 17.4, 1.5) * R.clamp(1.2 - z / 6) * 0.9);
    });

    emb(t, 0.25 * io(t, 0.2, 4.6) + io(t, 9, 17.5, 2));

    // 18–21 · made by Mander
    op($('#made'), io(t, 17.8, 21, 1));
    const m = ease.inOut(p(t, 18.2, 1.4));
    op($('#mander'), m * (1 - ease.inOut(p(t, 20.1, 0.9))));
    $('#mander').style.letterSpacing = `${(1.3 - 0.4 * m).toFixed(3)}em`;
  });
})();
</script>
</body></html>
