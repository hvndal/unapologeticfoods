<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>07 · Patience</title>
<!-- Quiet, cinematic cut. Scored with reels/score.py (original tanpura drone). -->
<link rel="stylesheet" href="lib/reel.css">
<style>
  .stage { background: #000; }
  .shot { position: absolute; inset: 0; overflow: hidden; }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.72) contrast(1.18) brightness(.62) sepia(.18); }
  .shade { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 45%, transparent 30%, rgba(0,0,0,.75)), linear-gradient(180deg, rgba(0,0,0,.55), transparent 25%, transparent 60%, rgba(0,0,0,.85)); }
  .word { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font-family: var(--f-display); font-style: italic; font-weight: 300; font-size: 26px; color: rgba(242, 233, 221, .9); letter-spacing: .01em; }
  .dip { position: absolute; inset: 0; background: #000; z-index: 500; }
  .cap2 { font-family: var(--f-sans); font-size: 10px; font-weight: 400; letter-spacing: .6em; text-transform: uppercase; color: rgba(214, 185, 138, .85); text-align: center; position: absolute; left: 0; right: 0; }
</style></head>
<body>
<div class="stage" id="stage">
  <div class="scene" id="open"><p class="word" style="top:452px" id="w0">Some things take <em>time.</em></p></div>
  <div id="shots"></div>
  <div class="scene" id="end">
    <img src="../../assets/brand/adda-philly-badge.png" id="eb" alt="" style="position:absolute;left:50%;top:330px;width:92px;margin-left:-46px">
    <p class="display" id="ew" style="position:absolute;left:0;right:0;top:448px;text-align:center;font-size:44px">Adda <em style="color:var(--blush)">Philly</em></p>
    <p class="cap2" id="ec" style="top:512px">Fishtown · Philadelphia</p>
  </div>
  <div class="scene" id="sig"><p class="cap2" id="mander" style="top:470px;font-size:12px;letter-spacing:.9em;color:rgba(242,233,221,.8)">Mander</p></div>
  <div class="dip" id="dip"></div>
  <div class="grain" style="opacity:.08"></div>
</div>
<script src="lib/reel.js"></script>
<script>
(() => {
  const { $, p, ease, op } = R;
  window.DURATION = 24;
  const IMG = '../../assets/img/';
  // [start, end, source, pos, zoom from→to, drift y px, word]
  const SHOTS = [
    [3, 7, 'biryani-close.webp', '58% 40%', 1.9, 2.1, -30, 'Sealed.'],
    [7, 10.5, 'butter-chicken-close.webp', '50% 45%', 1.55, 1.7, 26, 'Smoked.'],
    [10.5, 14.5, 'fire', '50% 50%', 1.05, 1.15, 0, 'Fired.'],
    [14.5, 18, 'samosa-close.webp', '38% 55%', 2.0, 2.2, -20, 'Folded by hand.']
  ];
  const host = $('#shots');
  SHOTS.forEach(([a, b, src, pos, z0, z1, dy, word]) => {
    const el = R.html(`<div class="scene shot"><img ${src === 'fire' ? '' : `src="${IMG + src}"`} style="object-position:${pos}" alt=""><div class="shade"></div><p class="word">${word}</p></div>`);
    host.appendChild(el);
    const img = $('img', el), w = $('.word', el);
    R.scene(el, a, b, lt => {
      const d = b - a, k = lt / d;
      if (src === 'fire') R.fire(img, 3 + lt * 0.5);
      img.style.transform = `translateY(${(dy * k).toFixed(2)}px) scale(${R.lerp(z0, z1, k).toFixed(4)})`;
      op(w, ease.inOut(p(lt, 0.9, 1)) * (1 - ease.inOut(p(lt, d - 1, 0.8))));
    });
  });
  R.scene($('#open'), 0, 3, lt => op($('#w0'), ease.inOut(p(lt, 0.5, 1.2)) * (1 - ease.inOut(p(lt, 2.2, 0.7)))));
  R.scene($('#end'), 18, 21.6, lt => {
    op($('#eb'), ease.inOut(p(lt, 0.4, 1.2)));
    op($('#ew'), ease.inOut(p(lt, 0.9, 1.2)));
    op($('#ec'), ease.inOut(p(lt, 1.4, 1.2)));
    $('#end').style.opacity = (1 - ease.inOut(p(lt, 2.8, 0.8))).toFixed(3);
  });
  R.scene($('#sig'), 21.6, 24, lt => op($('#mander'), ease.inOut(p(lt, 0.2, 1)) * (1 - ease.inOut(p(lt, 1.8, 0.6)))));
  // dips to black between shots
  const cuts = [3, 7, 10.5, 14.5, 18];
  R.every(t => {
    let v = t < 0.6 ? 1 - t / 0.6 : 0;
    for (const c of cuts) v = Math.max(v, 1 - Math.min(1, Math.abs(t - c) / 0.55));
    $('#dip').style.opacity = ease.inOut(R.clamp(v)).toFixed(3);
  });
})();
</script>
</body></html>
