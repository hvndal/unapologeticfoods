<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>03 · A menu of places</title>
<!-- Silent. Nine places, 1.4 s each; slides land on a 0.7 s grid. -->
<link rel="stylesheet" href="lib/reel.css">
<style>
  .bone { background: var(--bone); color: var(--ink); }
  .intro .chapter { position: absolute; left: 44px; top: 214px; color: var(--oxblood); }
  .intro__h { position: absolute; left: 44px; top: 262px; font-size: 104px; }
  .intro__h em { color: var(--terracotta); }
  .intro__p { position: absolute; left: 44px; right: 56px; top: 500px; font-family: var(--f-display); font-size: 25px; line-height: 1.32; color: rgba(21, 16, 14, .82); }
  .intro__lotus { position: absolute; left: 44px; top: 660px; color: var(--gold); }

  .card { }
  .card__pat { position: absolute; inset: 0; opacity: .08; }
  .card__region { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-family: var(--f-display); font-style: italic; font-weight: 300; font-size: 88px; line-height: 1.02; letter-spacing: -.02em; font-variation-settings: "opsz" 144, "SOFT" 40; }
  .card__course { position: absolute; left: 0; right: 0; top: 260px; display: flex; justify-content: center; align-items: center; gap: 12px; font-size: 10px; }
  .card__course .hair { width: 30px; }
  .card__media { position: absolute; left: 50%; top: 296px; width: 270px; height: 350px; margin-left: -135px; }
  .card__frame { position: absolute; inset: 0; -webkit-mask: var(--arch-mask) center / 100% 100% no-repeat; mask: var(--arch-mask) center / 100% 100% no-repeat; overflow: hidden; }
  .card__frame img { width: 100%; height: 100%; object-fit: cover; }
  .card__hl { position: absolute; left: -12px; top: -12px; width: 294px; height: 374px; overflow: visible; }
  .card__hl path { fill: none; stroke: var(--gold); stroke-width: .6; }
  .card__plain { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 18px; text-align: center; }
  .card__plain .deva { font-size: 64px; line-height: 1.25; }
  .card__plain .lotus { width: 96px; height: 20px; }
  .card__name { position: absolute; left: 30px; right: 30px; top: 672px; text-align: center; font-size: 38px; }
  .card__line { position: absolute; left: 60px; right: 60px; top: 724px; text-align: center; font-size: 15px; line-height: 1.5; }
  .card__num { position: absolute; left: 44px; top: 150px; font-family: var(--f-display); font-style: italic; font-size: 15px; }

  .route { position: absolute; left: 0; right: 0; top: 84px; z-index: 600; text-align: center; pointer-events: none; }
  .route .cap { font-size: 10px; }
  .route__track { position: relative; margin: 14px auto 0; width: 380px; height: 12px; }
  .route__track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: currentColor; opacity: .35; }
  .route__fill { position: absolute; left: 0; top: 50%; height: 1px; background: currentColor; transform-origin: 0 50%; }
  .route__dot { position: absolute; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; border: 1px solid currentColor; background: transparent; }

  .close { background: var(--ink); }
  .close__pat { position: absolute; inset: 0; background: var(--petals) 0 0 / 40px 36px; opacity: .07; }
  .close__h { position: absolute; left: 44px; right: 40px; top: 300px; font-size: 64px; }
  .close__h em { color: var(--blush); }
  .close .chapter { position: absolute; left: 44px; top: 250px; color: var(--gold-soft); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="scene bone intro" id="intro">
    <p class="chapter"><i>III</i>The Menu</p>
    <h1 class="display intro__h"><span class="line"><span>A menu</span></span><span class="line"><span>of <em>places</em></span></span></h1>
    <p class="intro__p"><span class="line"><span>Every plate comes from</span></span><span class="line"><span>somewhere specific.</span></span></p>
    <svg class="lotus intro__lotus" viewBox="0 0 120 24"><use href="#lotus"/></svg>
  </div>
  <div id="cards"></div>
  <div class="scene close" id="close">
    <div class="close__pat"></div>
    <p class="chapter"><i>III</i>The Menu</p>
    <p class="display close__h"><span class="line"><span>We cook it</span></span><span class="line"><span>the way it is</span></span><span class="line"><span>cooked <em>there.</em></span></span></p>
  </div>
  <div class="route" id="route"><p class="cap">A menu of places</p><div class="route__track"><div class="route__fill"></div></div></div>
  <div class="vignette" style="opacity:.6"></div>
  <div class="grain"></div>
</div>

<script src="lib/reel.js"></script>
<script>
(() => {
  const { $, $$, p, ease, op, rise } = R;
  const stage = $('#stage');
  window.DURATION = 21;
  const IMG = '../../assets/img/';

  R.opener(stage, { start: 0, dur: 2 });

  {
    const el = $('#intro');
    const ch = $('.chapter', el), lot = $('.intro__lotus', el);
    const h = $$('.intro__h .line > span', el), pp = $$('.intro__p .line > span', el);
    R.scene(el, 2, 5.2, lt => {
      const w = ease.site(p(lt, 0, 0.7));
      el.style.clipPath = `inset(${((1 - w) * 100).toFixed(3)}% 0 0 0)`;
      op(ch, ease.site(p(lt, 0.2, 0.7)));
      R.riseAll(h, lt, 0.3, 0.12, 1);
      R.riseAll(pp, lt, 0.9, 0.1, 0.9);
      const l = ease.site(p(lt, 1.3, 0.8));
      op(lot, l);
      lot.style.transform = `scaleX(${0.6 + 0.4 * l})`;
      lot.style.transformOrigin = '0 50%';
    });
  }

  // grounds from the site's palette; fg = type, acc = region colour
  const G = {
    ink: { bg: 'var(--ink)', fg: 'var(--bone)', acc: 'var(--blush)', sub: 'var(--gold-soft)', pat: 'var(--petals)' },
    green: { bg: 'var(--green)', fg: 'var(--bone)', acc: 'var(--blush)', sub: 'var(--gold-soft)', pat: 'var(--petals-sage)' },
    ox: { bg: 'var(--oxblood)', fg: 'var(--bone)', acc: 'var(--blush)', sub: 'var(--gold-soft)', pat: 'var(--petals)' },
    bone: { bg: 'var(--bone)', fg: 'var(--ink)', acc: 'var(--oxblood)', sub: 'var(--oxblood)', pat: 'var(--jaali)' }
  };
  const PLACES = [
    { region: 'Mumbai', name: 'Bheja Fry', hi: 'भेजा फ्राई', course: 'Chhote · Small plates', line: 'Goat brains, onion and tomato masala, griddled pav', g: 'ink' },
    { region: 'Hyderabad', name: 'Lukmi', hi: 'लुकमी', course: 'Chhote · Small plates', line: 'Flaky square pastry, minced goat, green chilli', g: 'green' },
    { region: 'Punjab', name: 'Samosa', hi: 'समोसा', course: 'Chhote · Small plates', line: 'Hand-folded pastry, spiced potato and peas, tamarind', g: 'bone', src: 'samosa-close.webp', pos: '40% 50%' },
    { region: 'Old Delhi', name: 'Tawa Kaleji', hi: 'तवा कलेजी', course: 'Chhote · Off the tawa', line: 'Goat liver seared on the iron, onion, lime', g: 'ox' },
    { region: 'Amritsar', name: 'Tandoori Macchi', hi: 'तंदूरी मच्छी', course: 'Tandoor · The clay oven', line: 'River fish, carom seed, mustard oil', g: 'ink' },
    { region: 'Awadh', name: 'Baby Goat Biryani', hi: 'बिरयानी', course: 'Handi & Dum · Sealed pots', line: 'Young goat, aged basmati, sealed and cooked dum', g: 'bone', src: 'biryani-close.webp', pos: '50% 45%' },
    { region: 'Rajasthan', name: 'Junglee Maas', hi: 'जंगली मांस', course: 'Handi & Dum · Sealed pots', line: 'Goat, ghee, dried red chilli. Almost nothing else.', g: 'green' },
    { region: 'Delhi', name: 'Butter Chicken', hi: 'मक्खन मुर्ग़', course: 'The signature · By preorder', line: 'Cold-smoked chicken, house-churned butters, finished tableside', g: 'ox', src: 'butter-chicken-close.webp', pos: '50% 55%' },
    { region: 'Kolkata', name: 'Mishti Doi', hi: 'मिष्टि दोई', course: 'Meetha · Sweet', line: 'Roni’s hometown gets the last word.', g: 'bone' }
  ];
  const T0 = 4.5, STEP = 1.4, SLIDE = 0.6;
  const host = $('#cards');
  const track = $('.route__track'), fill = $('.route__fill'), route = $('#route');
  PLACES.forEach((c, i) => {
    const g = G[c.g];
    const media = c.src
      ? `<div class="card__frame"><img class="graded" src="${IMG + c.src}" style="object-position:${c.pos}" alt=""></div>`
      : `<div class="card__plain"><p class="deva" lang="hi" style="color:${g.acc}">${c.hi}</p><svg class="lotus" viewBox="0 0 120 24" style="color:var(--gold)"><use href="#lotus"/></svg></div>`;
    const el = R.html(`<div class="scene card" style="background:${g.bg};color:${g.fg}">
      <div class="card__pat" style="background:${g.pat} 0 0 / ${c.g === 'bone' ? '26px 26px' : '40px 36px'}"></div>
      <p class="card__region" style="color:${g.acc}"><span class="line"><span>${c.region}</span></span></p>
      <p class="cap card__course" style="color:${g.sub}"><span class="hair"></span>${c.course}<span class="hair"></span></p>
      <div class="card__media"><svg class="card__hl" viewBox="-10 -10 220 320" preserveAspectRatio="none"><path d="${R.ARCH}" transform="translate(-6 -6) scale(1.06 1.04)"/></svg>${media}</div>
      <p class="display card__name"><span class="line"><span>${c.name}${c.src ? ` <span class="deva" lang="hi" style="font-size:.5em;color:${g.acc};letter-spacing:0">${c.hi}</span>` : ''}</span></span></p>
      <p class="card__line"><span class="line"><span style="opacity:.8">${c.line}</span></span></p>
    </div>`);
    host.appendChild(el);
    const dot = R.html('<i class="route__dot"></i>');
    dot.style.left = `${(i / (PLACES.length - 1)) * 100}%`;
    track.appendChild(dot);
    c.dot = dot;
    const s = T0 + i * STEP;
    const next = s + STEP;
    const region = $('.card__region .line > span', el);
    const course = $('.card__course', el);
    const mediaEl = $('.card__media', el);
    const hl = $('.card__hl path', el);
    const name = $('.card__name .line > span', el);
    const line = $('.card__line .line > span', el);
    const img = $('img', el);
    R.scene(el, s, i === PLACES.length - 1 ? next + SLIDE : next + SLIDE, (lt, t) => {
      const inn = ease.site(p(lt, 0, SLIDE));
      const out = ease.site(p(t, next, SLIDE));
      el.style.transform = `translateX(${((1 - inn) * 100 - out * 28).toFixed(3)}%)`;
      el.style.filter = out > 0 ? `brightness(${(1 - 0.45 * out).toFixed(3)})` : '';
      rise(region, lt, 0.12, 0.8);
      op(course, ease.site(p(lt, 0.3, 0.6)));
      const m = ease.site(p(lt, 0.18, 0.8));
      mediaEl.style.clipPath = `inset(${((1 - m) * 380 - 16).toFixed(2)}px -16px -16px -16px)`;
      R.drawMid(hl, ease.inOut(p(lt, 0.25, 0.9)));
      if (img) img.style.transform = `scale(${(1.14 - 0.1 * ease.out(p(lt, 0, 2))).toFixed(4)})`;
      rise(name, lt, 0.32, 0.8);
      rise(line, lt, 0.42, 0.8);
    });
    c.s = s; c.fg = g.fg;
  });

  {
    const el = $('#close');
    const s = T0 + PLACES.length * STEP;
    const ch = $('.chapter', el), h = $$('.close__h .line > span', el);
    R.scene(el, s, s + 1.9, lt => {
      el.style.transform = `translateX(${((1 - ease.site(p(lt, 0, SLIDE))) * 100).toFixed(3)}%)`;
      op(ch, ease.site(p(lt, 0.2, 0.6)));
      R.riseAll(h, lt, 0.25, 0.1, 0.9);
    });
    R.endcard(stage, { start: s + 1.9, dur: DURATION - s - 1.9, line: 'A menu of <em>places.</em>' });
  }

  // the route across the top: one dot per place
  R.every(t => {
    const on = t >= T0 && t < T0 + PLACES.length * STEP + SLIDE;
    route.style.display = on ? 'block' : 'none';
    if (!on) return;
    let cur = 0;
    PLACES.forEach((c, i) => { if (t >= c.s) cur = i; });
    // colour follows whichever card has slid in
    const k = PLACES.findIndex(c => t < c.s + SLIDE / 2);
    const vis = k < 0 ? PLACES.length - 1 : Math.max(0, k - 1);
    route.style.color = PLACES[vis].fg;
    op(route, p(t, T0, 0.5) * (1 - p(t, T0 + PLACES.length * STEP, 0.4)));
    const prog = (cur + ease.site(p(t, PLACES[cur].s, SLIDE))) / (PLACES.length - 1);
    fill.style.transform = `scaleX(${R.clamp(prog - 1 / (PLACES.length - 1)).toFixed(4)})`;
    PLACES.forEach((c, i) => {
      const a = i < cur ? 1 : i === cur ? ease.site(p(t, c.s, SLIDE)) : 0;
      c.dot.style.background = a > 0.5 ? 'currentColor' : 'transparent';
      c.dot.style.transform = `scale(${(1 + (i === cur ? 0.6 * a : 0)).toFixed(3)})`;
    });
  });
})();
</script>
</body>
</html>
